version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devsight-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devsight
      MYSQL_USER: devsight_user
      MYSQL_PASSWORD: devsight_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devsight-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://devsight_user:devsight_password@mysql:3306/devsight
      - SECRET_KEY=devsight_jwt_secret_key_2026_antigravity_safe
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./generated:/app/generated

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devsight-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
